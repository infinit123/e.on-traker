<!doctype html><html lang='ro'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#0b5fff'><title>GazTrack</title><link rel='manifest' href='./manifest.webmanifest'><link rel='apple-touch-icon' href='./icon.svg'><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f6fb;color:#14213d}.app{max-width:720px;margin:auto;padding:18px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center}.sub{color:#667085}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.card,.panel{background:white;border-radius:18px;padding:16px;box-shadow:0 4px 20px #243b5310}.n{font-size:28px;font-weight:800}.red{color:#d92d20}.orange{color:#f79009}.green{color:#039855}button{border:0;border-radius:14px;padding:13px 16px;font-weight:700;background:#0b5fff;color:white}input,select,textarea{width:100%;padding:12px;margin:5px 0 12px;border:1px solid #d0d5dd;border-radius:12px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{padding:13px 0;border-bottom:1px solid #eee}.pill{float:right;padding:5px 9px;border-radius:99px;background:#fee4e2;color:#b42318;font-size:12px}.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;border-top:1px solid #ddd;display:flex;justify-content:center}.navin{width:min(720px,100%);display:flex}.nav button{background:none;color:#667085;flex:1;border-radius:0;font-size:12px}.nav button.active{color:#0b5fff}section{display:none}section.active{display:block}@media(max-width:500px){.cards{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><main class='app'><div class='top'><div><h1>GazTrack</h1><div class='sub'>Verificări & revizii gaze</div></div><button onclick="show('add')">+ Adaugă</button></div>
<section id='home' class='active'><div class='cards'><div class='card'><div class='sub'>Expirate</div><div class='n red' id='expired'>0</div></div><div class='card'><div class='sub'>≤ 30 zile</div><div class='n orange' id='soon'>0</div></div><div class='card'><div class='sub'>În termen</div><div class='n green' id='ok'>0</div></div></div><div class='panel'><b>Următoarele scadențe</b><div id='list'></div></div></section>
<section id='clients'><h2>Clienți</h2><input id='search' placeholder='Caută nume sau adresă' oninput='renderClients()'><div class='panel' id='clientsList'></div></section>
<section id='add'><h2>Adaugă instalație</h2><div class='panel'><form id='form'><label>Nume client</label><input id='name' required><label>Telefon</label><input id='phone' inputmode='tel'><label>Adresă</label><input id='address' required><div class='row'><div><label>Tip lucrare</label><select id='type'><option>Verificare</option><option>Revizie</option></select></div><div><label>Scadență</label><input id='due' type='date' required></div></div><label>Observații</label><textarea id='notes'></textarea><button type='submit'>Salvează</button></form></div></section>
</main><nav class='nav'><div class='navin'><button id='nhome' class='active' onclick="show('home')">Acasă</button><button id='nclients' onclick="show('clients')">Clienți</button><button id='nadd' onclick="show('add')">Adaugă</button></div></nav><script>let data=JSON.parse(localStorage.getItem('gaztrack')||'[]');function save(){localStorage.setItem('gaztrack',JSON.stringify(data))}function days(d){return Math.ceil((new Date(d+'T23:59:59')-new Date())/86400000)}function render(){let sorted=[...data].sort((a,b)=>a.due.localeCompare(b.due));document.getElementById('expired').textContent=data.filter(x=>days(x.due)<0).length;document.getElementById('soon').textContent=data.filter(x=>days(x.due)>=0&&days(x.due)<=30).length;document.getElementById('ok').textContent=data.filter(x=>days(x.due)>30).length;document.getElementById('list').innerHTML=sorted.length?sorted.slice(0,6).map(x=>`<div class='item'><b>${esc(x.name)}</b><span class='pill'>${days(x.due)<0?'Expirat':days(x.due)+' zile'}</span><br><span class='sub'>${esc(x.type)} · ${esc(x.address)} · ${x.due}</span></div>`).join(''):`<p class='sub'>Nicio instalație adăugată încă.</p>`;renderClients()}function renderClients(){let q=(document.getElementById('search')?.value||'').toLowerCase();let arr=data.filter(x=>(x.name+' '+x.address).toLowerCase().includes(q));document.getElementById('clientsList').innerHTML=arr.length?arr.map((x,i)=>`<div class='item'><b>${esc(x.name)}</b><br><span class='sub'>${esc(x.address)} · ${esc(x.type)} · ${x.due}</span><br><button style='margin-top:8px;background:#d92d20' onclick='del(${data.indexOf(x)})'>Șterge</button></div>`).join(''):`<span class='sub'>Niciun rezultat.</span>`}function del(i){if(confirm('Ștergi înregistrarea?')){data.splice(i,1);save();render()}}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(id){document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('n'+id)?.classList.add('active');render()}document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();data.push({name:name.value,phone:phone.value,address:address.value,type:type.value,due:due.value,notes:notes.value});save();e.target.reset();show('home')});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();</script></body></html>
